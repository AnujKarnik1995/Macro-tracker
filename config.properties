# Personal targets baked into the widget at build time (see app/build.gradle.kts → BuildConfig).
# Non-secret; kept in git for now. Dates are ISO yyyy-MM-dd.
# If this file is absent, build.gradle.kts falls back to neutral defaults so a fresh clone still builds.
GOAL_DATE=2026-10-07
GOAL_LABEL=Oct 7
CHALLENGE_START=2026-06-15
PHASE_LABEL=Cutting Phase

# Strength-session budget for the Energy page's training block.
# GYM_TOTAL sessions between GYM_START and GOAL_DATE. 16 Aug -> 7 Oct is 7.6 weeks, so 22 = 2.9/wk.
# Set GYM_TOTAL=0 to hide the block. Sessions before GYM_START are ignored.
GYM_START=2026-08-16
GYM_TOTAL=22
